id: http://example.org/vegvesen/vokabular/def/schema
name: svv_vokabular
title: SKOS-vokabular (Excel-mal v8)
description: >-
  Model of one vocabulary (skos:ConceptScheme) and its concepts as captured in
  SKOS-Excel-mal-v8. Code lists (kodeverk) are not modelled here.
  Each slot is annotated with its v8 Excel column (excel_column) and the
  technical column name in row 22 (excel_name), which is also intended as the
  SharePoint List internal column name.
  Language tags (in_language) and enum meanings are applied by the project's
  RDF writer (vocabtool/linkml_rdf.py); the standard LinkML RDF dumper ignores them.
version: 0.1.0
license: CC-BY-4.0

prefixes:
  linkml: https://w3id.org/linkml/
  skos: http://www.w3.org/2004/02/skos/core#
  xkos: http://rdf-vocabulary.ddialliance.org/xkos#
  dct: http://purl.org/dc/terms/
  dcat: http://www.w3.org/ns/dcat#
  euvoc: http://publications.europa.eu/ontology/euvoc#
  skosno: https://data.norge.no/vocabulary/skosno#
  adms: http://www.w3.org/ns/adms#
  owl: http://www.w3.org/2002/07/owl#
  vok: http://example.org/vegvesen/vokabular/
  svv: http://example.org/vegvesen/vokabular/def#
  concept_status: http://publications.europa.eu/resource/authority/concept-status/

default_prefix: svv
default_range: string
imports:
  - linkml:types

classes:

  ConceptScheme:
    class_uri: skos:ConceptScheme
    tree_root: true
    description: One vocabulary = one Excel workbook (vokabular sheet, rows 1-16).
    slots:
      - uri
      - kortnavn
      - title
      - main_language
      - creator
      - publisher
      - issued
      - concepts
      - collections

  Concept:
    class_uri: skos:Concept
    description: One row in the vokabular sheet (row 23 onwards).
    slots:
      - uri
      - identifier
      - pref_label_nb
      - pref_label_en
      - pref_label_nn
      - notation
      - definition_nb
      - definition_en
      - definition_nn
      - alt_label_nb
      - alt_label_en
      - alt_label_nn
      - audience
      - source
      - relationship_with_source
      - scope_note
      - editorial_note
      - example
      - subject
      - hidden_label
      - broader
      - is_part_of
      - related
      - relation_role
      - exact_match
      - close_match
      - contact_point
      - created
      - created_by
      - modified
      - modified_by
      - version_info
      - version_notes
      - status
      - start_date
      - end_date
      - data_structure_label
      - value_range
      - tier
      - pref_label_en_us
      - pref_label_en_gb
      - pref_label_de
      - pref_label_es
      - alt_label_en_us
      - alt_label_en_gb
      - alt_label_de
      - alt_label_es
      - definition_en_us
      - scope_note_en_us
      - in_scheme

  Collection:
    class_uri: skos:Collection
    description: >-
      A group of concepts, recorded in the main-language scope note of each member
      ("Inngår i samlingen X." / "Inngår i samlingene X, Y."). There is no Excel row for the
      collection itself. URI <scheme URI>/samling/<CamelCase name>; the label is the name as written.
      Unordered and not nested.
    slots:
      - uri
      - pref_label_nb
      - pref_label_en
      - pref_label_nn
      - pref_label_en_us
      - pref_label_en_gb
      - pref_label_de
      - pref_label_es
      - member

slots:

  # ---------- scheme ----------
  uri:
    identifier: true
    range: uri
    description: >-
      Concept or scheme URI. For concepts: <scheme URI>/<concept name>, where column B of the
      workbook holds only the CamelCase concept name (e.g. Rekkverk) and the tools build the URI.
    annotations: {excel_column: B, excel_name: begrep, excel_value: CamelCase concept name only}
  kortnavn:
    slot_uri: svv:kortnavn
    required: true
    pattern: "^[A-Za-z0-9][A-Za-z0-9-]*$"
    description: Short name of the vocabulary, letters, digits and hyphens, e.g. N101 or crochet-us (cell B14).
    annotations: {excel_cell: B14}
  title:
    slot_uri: dct:title
    in_language: nb
    required: true
    annotations: {excel_cell: B15}
  main_language:
    slot_uri: svv:mainLanguage
    description: >-
      BCP 47 tag of the language in which every concept must have a prefLabel and a definition
      (scheme row "hovedspråk"; default nb). Enforced by SHACL (shapes/cross_row.shacl.ttl).
    annotations: {excel_label: hovedspråk}
  creator:
    slot_uri: dct:creator
    annotations: {excel_cell: B16}
  publisher:
    slot_uri: dct:publisher
    description: System-generated at publication.
    annotations: {excel_cell: B17}
  issued:
    slot_uri: dct:issued
    range: date
    description: System-generated at publication.
    annotations: {excel_cell: B18}
  concepts:
    slot_uri: svv:concepts
    range: Concept
    multivalued: true
    inlined_as_list: true
    description: >-
      Container slot for the data file only. Not written to RDF; the RDF writer
      emits skos:inScheme on each concept instead.
    annotations: {rdf_skip: true}
  collections:
    slot_uri: svv:collections
    range: Collection
    multivalued: true
    inlined_as_list: true
    description: >-
      Container slot for the data file only. Not written to RDF; the collections are written
      as resources of their own. Built from the scope-note sentence, not from a column.
    annotations: {rdf_skip: true}
  member:
    slot_uri: skos:member
    range: Concept
    multivalued: true
    required: true
    description: Concepts whose main-language scope note names the collection.
    annotations: {excel_source: "scope note sentence: Inngår i samlingen/samlingene …"}
  in_scheme:
    slot_uri: skos:inScheme
    range: uri
    description: Set by the converter from the scheme URI.

  # ---------- identification and labels ----------
  identifier:
    slot_uri: dct:identifier
    required: true
    pattern: "^[A-Za-z0-9][A-Za-z0-9-]*$"
    description: <kortnavn>-<concept name>, e.g. N101-Rekkverk (formula in column A). Relations in Excel use the concept name.
    annotations: {excel_column: A, excel_name: intern_identifikator, requirement: obligatorisk}
  pref_label_nb:
    slot_uri: skos:prefLabel
    in_language: nb
    description: Recommended term, bokmål. Lowercase except acronyms (S05). Required when the main language is nb (SHACL rule).
    annotations: {excel_column: C, excel_name: anbefalt_term_bokmål, requirement: obligatorisk}
  pref_label_en:
    slot_uri: skos:prefLabel
    in_language: en
    annotations: {excel_column: D, excel_name: anbefalt_term_engelsk, requirement: valgfri}
  pref_label_nn:
    slot_uri: skos:prefLabel
    in_language: nn
    description: Obligatory in the template, but left empty by extraction for the expert (S06).
    annotations: {excel_column: E, excel_name: anbefalt_term_nynorsk, requirement: obligatorisk}
  notation:
    slot_uri: skos:notation
    annotations: {excel_column: F, excel_name: notasjon_eller_kode, requirement: valgfri}
  definition_nb:
    slot_uri: skos:definition
    in_language: nb
    description: Required when the main language is nb (SHACL rule).
    annotations: {excel_column: G, excel_name: definisjon_bokmål, requirement: obligatorisk}
  definition_en:
    slot_uri: skos:definition
    in_language: en
    annotations: {excel_column: H, excel_name: definisjon_engelsk, requirement: valgfri}
  definition_nn:
    slot_uri: skos:definition
    in_language: nn
    annotations: {excel_column: I, excel_name: definisjon_nynorsk, requirement: obligatorisk}
  alt_label_nb:
    slot_uri: skos:altLabel
    in_language: nb
    multivalued: true
    annotations: {excel_column: J, excel_name: tillat_term_bokmål, requirement: anbefalt, separator: ","}
  alt_label_en:
    slot_uri: skos:altLabel
    in_language: en
    multivalued: true
    annotations: {excel_column: L, excel_name: tillat_term_engelsk, requirement: anbefalt, separator: ","}
  alt_label_nn:
    slot_uri: skos:altLabel
    in_language: nn
    multivalued: true
    annotations: {excel_column: K, excel_name: tillat_term_nynorsk, requirement: anbefalt, separator: ","}
  hidden_label:
    slot_uri: skos:hiddenLabel
    in_language: nb
    description: Discouraged term, e.g. a common misspelling.
    annotations: {excel_column: T, excel_name: frarådd_term, requirement: valgfri}

  # ---------- language extension (template v8-lang-ext, columns AN-AW; tier moves to AX) ----------
  pref_label_en_us:
    slot_uri: skos:prefLabel
    in_language: en-US
    annotations: {excel_column: AN, excel_name: anbefalt_term_engelsk_us, requirement: valgfri, template: v8-lang-ext}
  pref_label_en_gb:
    slot_uri: skos:prefLabel
    in_language: en-GB
    annotations: {excel_column: AO, excel_name: anbefalt_term_engelsk_gb, requirement: valgfri, template: v8-lang-ext}
  pref_label_de:
    slot_uri: skos:prefLabel
    in_language: de
    annotations: {excel_column: AP, excel_name: anbefalt_term_tysk, requirement: valgfri, template: v8-lang-ext}
  pref_label_es:
    slot_uri: skos:prefLabel
    in_language: es
    annotations: {excel_column: AQ, excel_name: anbefalt_term_spansk, requirement: valgfri, template: v8-lang-ext}
  alt_label_en_us:
    slot_uri: skos:altLabel
    in_language: en-US
    multivalued: true
    annotations: {excel_column: AR, excel_name: tillat_term_engelsk_us, requirement: valgfri, template: v8-lang-ext, separator: ","}
  alt_label_en_gb:
    slot_uri: skos:altLabel
    in_language: en-GB
    multivalued: true
    annotations: {excel_column: AS, excel_name: tillat_term_engelsk_gb, requirement: valgfri, template: v8-lang-ext, separator: ","}
  alt_label_de:
    slot_uri: skos:altLabel
    in_language: de
    multivalued: true
    annotations: {excel_column: AT, excel_name: tillat_term_tysk, requirement: valgfri, template: v8-lang-ext, separator: ","}
  alt_label_es:
    slot_uri: skos:altLabel
    in_language: es
    multivalued: true
    annotations: {excel_column: AU, excel_name: tillat_term_spansk, requirement: valgfri, template: v8-lang-ext, separator: ","}
  definition_en_us:
    slot_uri: skos:definition
    in_language: en-US
    annotations: {excel_column: AV, excel_name: definisjon_engelsk_us, requirement: valgfri, template: v8-lang-ext}
  scope_note_en_us:
    slot_uri: skos:scopeNote
    in_language: en-US
    description: Usage note in US English, e.g. a warning that a term means another concept elsewhere.
    annotations: {excel_column: AW, excel_name: merknad_engelsk_us, requirement: valgfri, template: v8-lang-ext}

  # ---------- documentation ----------
  audience:
    slot_uri: dct:audience
    annotations: {excel_column: M, excel_name: målgruppe}
  source:
    slot_uri: dct:source
    range: uri
    annotations: {excel_column: N, excel_name: kilde, requirement: valgfri}
  relationship_with_source:
    slot_uri: skosno:relationshipWithSource
    annotations: {excel_column: O, excel_name: forhold_til_kilde}
  scope_note:
    slot_uri: skos:scopeNote
    in_language: nb
    annotations: {excel_column: P, excel_name: merknad, requirement: anbefalt}
  editorial_note:
    slot_uri: skos:editorialNote
    annotations: {excel_column: Q, excel_name: merknad_til_etableringmåte, requirement: valgfri}
  example:
    slot_uri: skos:example
    annotations: {excel_column: R, excel_name: eksempel, requirement: valgfri}
  subject:
    slot_uri: dct:subject
    in_language: nb
    description: Subject area. Template allows rdf:langString or skos:Concept; modelled as text for now.
    annotations: {excel_column: S, excel_name: fagområde, requirement: anbefalt}

  # ---------- relations (values in Excel are IDs; in the data file URIs) ----------
  broader:
    slot_uri: skos:broader
    range: Concept
    multivalued: true
    annotations: {excel_column: U, excel_name: har_overbegrep, requirement: valgfri, excel_value: concept name (column B)}
  is_part_of:
    slot_uri: xkos:isPartOf
    range: Concept
    multivalued: true
    annotations: {excel_column: V, excel_name: er_del_av, requirement: valgfri, excel_value: concept name (column B)}
  related:
    slot_uri: skos:related
    range: Concept
    multivalued: true
    annotations: {excel_column: W, excel_name: er_relatert_til, requirement: valgfri, separator: ",", excel_value: concept name (column B)}
  relation_role:
    slot_uri: skosno:relationRole
    in_language: nb
    annotations: {excel_column: X, excel_name: relasjonsrolle, requirement: anbefalt}
  exact_match:
    slot_uri: skos:exactMatch
    range: uri
    multivalued: true
    annotations: {excel_column: Y, excel_name: har_eksakt_samsvar_med, requirement: valgfri}
  close_match:
    slot_uri: skos:closeMatch
    range: uri
    multivalued: true
    annotations: {excel_column: Z, excel_name: har_nært_samsvar_med, requirement: valgfri}

  # ---------- governance ----------
  contact_point:
    slot_uri: dcat:contactPoint
    required: true
    description: >-
      E-mail address or web address. Vegvesen vocabularies use datagovernance@vegvesen.no
      (fixed value in the field instructions); the schema accepts any address.
    pattern: "^([^@\\s]+@[^@\\s]+\\.[A-Za-z]{2,}|https?://\\S+)$"
    annotations: {excel_column: AA, excel_name: kontaktpunkt, requirement: obligatorisk}
  created:
    slot_uri: dct:created
    range: date
    annotations: {excel_column: AC, excel_name: dato_opprettet, requirement: anbefalt}
  created_by:
    slot_uri: dct:contributor
    pattern: "^[^@\\s]+@vegvesen\\.no$"
    description: Hidden column; template formula = dct:creator of the vocabulary (cell B16).
    annotations: {excel_column: AD, excel_name: opprettet_av, hidden: true}
  modified:
    slot_uri: dct:modified
    range: date
    annotations: {excel_column: AE, excel_name: dato_sist_endret, requirement: anbefalt}
  modified_by:
    slot_uri: dct:contributor
    pattern: "^[^@\\s]+@vegvesen\\.no$"
    annotations: {excel_column: AF, excel_name: sist_endret_av}
  version_info:
    slot_uri: owl:versionInfo
    annotations: {excel_column: AG, excel_name: versjonsnummer, requirement: valgfri}
  version_notes:
    slot_uri: adms:versionNotes
    annotations: {excel_column: AH, excel_name: versjonsnote, requirement: valgfri}
  status:
    slot_uri: euvoc:status
    range: ConceptStatus
    annotations: {excel_column: AI, excel_name: status, requirement: anbefalt}
  start_date:
    slot_uri: euvoc:startDate
    range: date
    annotations: {excel_column: AJ, excel_name: gjelder_fra_og_med, requirement: anbefalt}
  end_date:
    slot_uri: euvoc:endDate
    range: date
    annotations: {excel_column: AK, excel_name: gjelder_til_og_med, requirement: anbefalt}
  data_structure_label:
    slot_uri: skosno:dataStructureLabel
    annotations: {excel_column: AL, excel_name: datastrukturterm, requirement: valgfri}
  value_range:
    slot_uri: skosno:valueRange
    annotations: {excel_column: AM, excel_name: verdiområde, requirement: valgfri}
  tier:
    slot_uri: svv:tier
    range: integer
    minimum_value: 1
    maximum_value: 3
    description: 1 = physical objects, spatial concepts, measurable properties; 2 = processes and states; 3 = normative requirements. Only Tier 1 becomes OWL classes.
    annotations: {excel_column: "AO (base template), AY (language extension): always the last column, outside the Excel table", excel_name: tier, requirement: internt}

enums:
  ConceptStatus:
    description: Status values from the template's statusliste, mapped to the EU concept-status authority table.
    permissible_values:
      kandidat: {meaning: concept_status:CANDIDATE}
      gjeldende: {meaning: concept_status:CURRENT}
      utdatert: {meaning: concept_status:DEPRECATED}
      forkastet: {meaning: concept_status:RETIRED}
